# dotshell duti config — default macOS apps for file types.
# Format: <bundle-id>  <.ext | UTI | url-scheme>  <role>
# Apply:  ./install.sh duti      (or: duti modules/duti/duti.conf)
# Add one: osascript -e 'id of app "<App>"' to get a bundle id, then add a line.

# Text & code
com.apple.TextEdit                 .txt    all
app.cyan.markedit                  .md     all
com.microsoft.VSCode               .json   all
com.microsoft.VSCode               .yaml   all
com.microsoft.VSCode               .toml   all
com.apple.dt.Xcode                 .xml    all
com.apple.iWork.Numbers            .csv    all
com.apple.Console                  .log    all
com.github.wez.wezterm             .sh     all
com.microsoft.VSCode               .py     all
com.microsoft.VSCode               .js     all
com.microsoft.VSCode               .ts     all
com.apple.Safari                   .html   all
com.microsoft.VSCode               .css    all

# Media
com.apple.Preview                  .png    all
com.apple.Preview                  .jpg    all
com.apple.Preview                  .gif    all
com.colliderli.iina                .mp4    all
com.apple.QuickTimePlayerX         .mov    all
com.apple.Music                    .mp3    all
com.apple.Preview                  .pdf    all

# Archives
com.apple.archiveutility           .zip    all
com.apple.archiveutility           .tar    all
com.apple.archiveutility           .gz     all

# URL schemes (not extensions — fill in if you want to set these):
# com.apple.Safari  http   all
# <mail-app-bundle-id>  mailto  all
